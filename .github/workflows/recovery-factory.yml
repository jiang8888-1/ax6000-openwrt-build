name: Build AX6000 110M recovery factory image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build recovery factory image
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git help2man libncurses5-dev libssl-dev python3-setuptools rsync swig unzip file wget zstd
          bash scripts/build-recovery-factory.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ax6000-110m-recovery-factory
          path: recovery-factory/
          if-no-files-found: error
          retention-days: 14
